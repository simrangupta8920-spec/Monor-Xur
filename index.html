<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Gracefully handle dev-mode HMR WebSocket in cloud sandbox where HMR is disabled by platform design
      (function() {
        // 1. Intercept WebSocket for vite-hmr and vite-ping to prevent failed network attempts
        if (typeof window !== 'undefined' && window.WebSocket) {
          const RealWebSocket = window.WebSocket;
          const FakeWebSocket = function(url, protocols) {
            const isVite = protocols === 'vite-hmr' || protocols === 'vite-ping' || 
              (typeof url === 'string' && (url.includes('token=') || url.includes('vite')));
            if (isVite) {
              const listeners = {};
              const dummyWs = {
                readyState: 1, // OPEN
                OPEN: 1,
                CONNECTING: 0,
                CLOSING: 2,
                CLOSED: 3,
                url: String(url),
                protocol: String(protocols || ''),
                send: function() {},
                close: function() {},
                addEventListener: function(event, handler) {
                  listeners[event] = listeners[event] || [];
                  listeners[event].push(handler);
                },
                removeEventListener: function(event, handler) {
                  if (listeners[event]) {
                    listeners[event] = listeners[event].filter(h => h !== handler);
                  }
                },
                dispatchEvent: function() { return true; },
              };
              return dummyWs;
            }
            return new RealWebSocket(url, protocols);
          };
          FakeWebSocket.prototype = RealWebSocket.prototype;
          FakeWebSocket.CONNECTING = 0;
          FakeWebSocket.OPEN = 1;
          FakeWebSocket.CLOSING = 2;
          FakeWebSocket.CLOSED = 3;
          window.WebSocket = FakeWebSocket;
        }

        // 2. Filter out any [vite] logger console messages
        const isViteLog = function(args) {
          if (!args || args.length === 0) return false;
          for (let i = 0; i < args.length; i++) {
            const item = args[i];
            if (!item) continue;
            const str = typeof item === 'string' ? item : (item.message || item.stack || String(item));
            if (str.includes('[vite]') || str.includes('websocket') || str.includes('WebSocket')) {
              return true;
            }
          }
          return false;
        };

        const origError = console.error;
        console.error = function(...args) {
          if (isViteLog(args)) return;
          origError.apply(console, args);
        };

        const origWarn = console.warn;
        console.warn = function(...args) {
          if (isViteLog(args)) return;
          origWarn.apply(console, args);
        };

        const origDebug = console.debug;
        console.debug = function(...args) {
          if (isViteLog(args)) return;
          origDebug.apply(console, args);
        };

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason) {
            const reasonStr = String(event.reason.message || event.reason || '');
            if (reasonStr.includes('[vite]') || reasonStr.includes('websocket')) {
              event.preventDefault();
            }
          }
        });

        window.addEventListener('error', function(event) {
          if (event && event.message) {
            const msgStr = String(event.message);
            if (msgStr.includes('[vite]') || msgStr.includes('websocket')) {
              event.preventDefault();
            }
          }
        });
      })();
    </script>
